apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # important: never two pods on the same volume
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: app-db
        key: DATABASE_URL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: registry.access.redhat.com/rhel9/postgresql-16:latest
              command:
                - /bin/sh
                - -c
                - >
                  pg_dump -h postgres -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -Fc
                  -f /backups/appdb-$(date +%F).dump &&
                  find /backups -name '*.dump' -mtime +7 -delete
              env:
                - name: POSTGRESQL_USER
                  valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRESQL_USER } }
                - name: POSTGRESQL_DATABASE
                  valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRESQL_DATABASE } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRESQL_PASSWORD } }
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups