<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add transaction | Finance</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        padding: 30px;
      }
      .box {
        max-width: 600px;
        margin: 20px auto;
        background: white;
        border: 1px solid #ddd;
        padding: 20px;
      }
      form {
        display: grid;
        gap: 10px;
      }
      input,
      select,
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
      }
      button {
        color: white;
        background: #2f6fed;
        border: 0;
        cursor: pointer;
      }
      a {
        color: #2f6fed;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p><a href="/">Home</a> | <a href="/transactions">All transactions</a></p>
      <h1
        th:text="${transaction.id == null ? 'Add transaction' : 'Edit transaction'}"
      >
        Add transaction
      </h1>
      <form
        th:action="${transaction.id == null ? '/transaction/new' : '/transaction/edit/' + transaction.id}"
        method="post"
      >
        <input
          type="number"
          name="amount"
          step="0.01"
          min="0.01"
          placeholder="Amount"
          th:value="${transaction.amount}"
          required
        />
        <input
          type="text"
          name="merchant"
          maxlength="150"
          placeholder="Merchant"
          th:value="${transaction.merchant}"
          required
        />
        <textarea
          name="description"
          rows="3"
          maxlength="500"
          placeholder="Description"
          th:text="${transaction.description}"
        ></textarea>
        <select name="transactionType" required>
          <option value="" disabled>Select transaction type</option>
          <option
            th:each="type : ${transactionTypes}"
            th:value="${type}"
            th:text="${type}"
            th:selected="${type == transaction.transactionType}"
          ></option>
        </select>
        <select name="category">
          <option value="" selected>Select category</option>
          <option
            th:each="category : ${categories}"
            th:value="${category}"
            th:text="${category.displayName}"
            th:selected="${category == transaction.category}"
          ></option>
        </select>
        <button type="submit">Save transaction</button>
      </form>
    </div>
  </body>
</html>
