<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        padding: 30px;
      }

      .box {
        max-width: 700px;
        margin: 20px auto;
        background: white;
        border: 1px solid #ddd;
        padding: 20px;
      }

      a {
        display: inline-block;
        margin-right: 12px;
        padding: 10px 14px;
        color: white;
        background: #2f6fed;
        text-decoration: none;
      }

      button {
        display: inline-block;
        margin-right: 12px;
        padding: 10px 14px;
        color: white;
        background: #2f6fed;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <span sec:authorize="isAuthenticated()"
        >Logged in as: <span th:text="${username}"></span>
        <form
          th:action="@{/logout}"
          method="post"
          sec:authorize="isAuthenticated()"
        >
          <button type="submit">Logout</button>
        </form>
      </span>
    </div>
    <br />
    <div class="box">
      <h1>Finance</h1>
      <p>Manage your personal transactions.</p>
      <a href="/transaction/new">Add transaction</a>
      <a href="/transactions">View all transactions</a>
      <a href="/transactions/import">Import transactions</a>
      <a sec:authorize="isAnonymous()" href="/login">Login</a>
      <a sec:authorize="isAnonymous()" href="/register">Register</a>
    </div>
  </body>
</html>
