<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 30px;
        }

        .box {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
        }

        form {
            display: grid;
            gap: 10px;
        }

        input, select, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Add transaction</h2>
        <form th:action="@{/transaction}" method="post">
            <input type="number" name="amount" step="0.01" placeholder="Amount" required>
            <input type="text" name="merchant" placeholder="Merchant" required>
            <textarea name="description" rows="3" placeholder="Description"></textarea>
            <select name="transactionType">
                <option value="INCOME">Income</option>
                <option value="EXPENSE">Expense</option>
            </select>
            <button type="submit">Click</button>
        </form>
    </div>

    <div class="box">
        <h2>Transactions</h2>
        <table>
            <thead>
                <tr>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Merchant</th>
                    <th>Description</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${transaction.amount}">0</td>
                    <td th:text="${transaction.transactionType}">INCOME</td>
                    <td th:text="${transaction.merchant}">merchant</td>
                    <td th:text="${transaction.description}">description</td>
                    <td>
                        <form th:action="@{/transaction/delete/{id}(id=${transaction.id})}" method="post">
                            <button type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
