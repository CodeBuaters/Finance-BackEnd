<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Finance</title>
  </head>
  <body>
    <h1>Register</h1>
    <p th:if="${error}" th:text="${error}"></p>
    <form action="/register" method="post" th:object="${registerRequest}">
      <input type="text" th:field="*{username}" placeholder="Username" required /><br />
      <input type="text" th:field="*{firstName}" placeholder="First name" required /><br />
      <input type="text" th:field="*{lastName}" placeholder="Last name" required /><br />
      <input type="email" th:field="*{email}" placeholder="Email" required /><br />
      <input type="password" th:field="*{password}" placeholder="Password" required /><br />
      <button type="submit">Register</button>
    </form>
    <a href="/">Home</a><br />
    <a href="/login">I already have an account</a>
  </body>
</html>
