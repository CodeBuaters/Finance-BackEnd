$kind: http-request
name: 'Create Transaction'
order: 1000
method: POST
url: '{{base_url}}/transaction/new'
body:
  type: urlencoded
  content:
    - key: amount
      value: '49.99'
      description: 'Transaction amount (BigDecimal)'
    - key: merchant
      value: 'Coffee Shop'
      description: 'Merchant name'
    - key: description
      value: 'Morning coffee'
      description: 'Optional description'
    - key: transactionType
      value: 'EXPENSE'
      description: 'EXPENSE or INCOME'
    - key: category
      value: 'FOOD'
      description: 'Optional category (e.g. FOOD, TRANSPORT, ENTERTAINMENT)'
